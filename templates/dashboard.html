<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twitch Chat - #ielziinho</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0e0e10;
    color: #efeff1;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #18181b;
    padding: 12px 20px;
    border-bottom: 1px solid #2d2d30;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
  }
  .status {
    font-size: 12px;
    color: #9147ff;
    background: #9147ff22;
    padding: 3px 10px;
    border-radius: 12px;
  }
  .status.connected { color: #00ff88; background: #00ff8822; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .msg {
    padding: 6px 10px;
    border-radius: 6px;
    line-height: 1.4;
    animation: fadeIn .15s ease;
  }
  .msg:hover { background: #1f1f23; }
  .msg .time { color: #5a5a5e; font-size: 11px; margin-right: 8px; }
  .msg .author { color: #bf94ff; font-weight: 600; margin-right: 8px; }
  .msg .content { word-break: break-word; }
  .empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5a5a5e;
    font-size: 14px;
  }
  #counter {
    font-size: 13px;
    color: #adadb8;
    margin-left: auto;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<header>
  <h1>#ielziinho</h1>
  <span class="status" id="status">desconectado</span>
  <span id="counter">0 mensagens</span>
</header>
<div id="chat">
  <div class="empty">Aguardando mensagens do chat...</div>
</div>
<script>
const chat = document.getElementById('chat');
const statusEl = document.getElementById('status');
const counterEl = document.getElementById('counter');
let count = 0;
let ws;

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws`);

  ws.onopen = () => {
    statusEl.textContent = 'conectado';
    statusEl.className = 'status connected';
  };

  ws.onclose = () => {
    statusEl.textContent = 'desconectado';
    statusEl.className = 'status';
    setTimeout(connect, 3000);
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    count++;
    counterEl.textContent = `${count} mensagens`;

    const empty = chat.querySelector('.empty');
    if (empty) empty.remove();

    const el = document.createElement('div');
    el.className = 'msg';
    el.innerHTML = `<span class="time">${data.timestamp}</span><span class="author">${escapeHtml(data.author)}</span><span class="content">${escapeHtml(data.content)}</span>`;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  };
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

connect();
</script>
</body>
</html>
